name: Build and push images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DOCKERHUB_REGISTRY: docker.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: alma-rust
            dockerfile: alma-rust/Containerfile
          - image: alma-dotnet-node
            dockerfile: alma-dotnet-node/Containerfile
          - image: alma-dotnet
            dockerfile: alma-dotnet/Containerfile
          - image: alma-node
            dockerfile: alma-node/Containerfile
          - image: debian-rust
            dockerfile: debian-rust/Containerfile
          - image: debian-dotnet-node
            dockerfile: debian-dotnet-node/Containerfile
          - image: debian-dotnet
            dockerfile: debian-dotnet/Containerfile
          - image: debian-node
            dockerfile: debian-node/Containerfile
          - image: alma-cpp
            dockerfile: alma-cpp/Containerfile
          - image: debian-cpp
            dockerfile: debian-cpp/Containerfile
          - image: debian-lmstudio
            dockerfile: debian-lmstudio/Containerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
            ${{ env.DOCKERHUB_REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7
        with:
          context: ./
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  export-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - image: alma-rust
            dockerfile: alma-rust/Containerfile
          - image: alma-dotnet-node
            dockerfile: alma-dotnet-node/Containerfile
          - image: alma-dotnet
            dockerfile: alma-dotnet/Containerfile
          - image: alma-node
            dockerfile: alma-node/Containerfile
          - image: debian-rust
            dockerfile: debian-rust/Containerfile
          - image: debian-dotnet-node
            dockerfile: debian-dotnet-node/Containerfile
          - image: debian-dotnet
            dockerfile: debian-dotnet/Containerfile
          - image: debian-node
            dockerfile: debian-node/Containerfile
          - image: alma-cpp
            dockerfile: alma-cpp/Containerfile
          - image: debian-cpp
            dockerfile: debian-cpp/Containerfile
          - image: debian-lmstudio
            dockerfile: debian-lmstudio/Containerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Compute lowercase image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ./
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: ${{ steps.image.outputs.name }}
          outputs: type=docker,dest=${{ matrix.image }}.tar
          cache-from: type=gha
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.image }}-image
          path: ${{ matrix.image }}.tar
          retention-days: 14
          compression-level: 0
