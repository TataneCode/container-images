services:
  alma-rust:
    image: ghcr.io/tatanecode/alma-rust:latest
    pull_policy: always
    container_name: alma-rust
    ports:
      - "2222:22"

  alma-dotnet-node:
    image: ghcr.io/tatanecode/alma-dotnet-node:latest
    pull_policy: always
    container_name: alma-dotnet-node
    ports:
      - "2223:22"

  alma-dotnet:
    image: ghcr.io/tatanecode/alma-dotnet:latest
    pull_policy: always
    container_name: alma-dotnet
    ports:
      - "2228:22"
  alma-node:
    image: ghcr.io/tatanecode/alma-node:latest
    pull_policy: always
    container_name: alma-node
    ports:
      - "2229:22"
  alma-cpp:
    image: ghcr.io/tatanecode/alma-cpp:latest
    pull_policy: always
    container_name: alma-cpp
    ports:
      - "2224:22"

  debian-rust:
    image: ghcr.io/tatanecode/debian-rust:latest
    pull_policy: always
    container_name: debian-rust
    ports:
      - "2225:22"

  debian-dotnet-node:
    image: ghcr.io/tatanecode/debian-dotnet-node:latest
    pull_policy: always
    container_name: debian-dotnet-node
    ports:
      - "2226:22"

  debian-dotnet:
    image: ghcr.io/tatanecode/debian-dotnet:latest
    pull_policy: always
    container_name: debian-dotnet
    ports:
      - "2230:22"
  debian-node:
    image: ghcr.io/tatanecode/debian-node:latest
    pull_policy: always
    container_name: debian-node
    ports:
      - "2231:22"
  debian-cpp:
    image: ghcr.io/tatanecode/debian-cpp:latest
    pull_policy: always
    container_name: debian-cpp
    ports:
      - "2227:22"
  debian-lmstudio:
    image: ghcr.io/tatanecode/debian-lmstudio:latest
    pull_policy: always
    container_name: debian-lmstudio
    shm_size: "1gb"
    ports:
      - "3000:3000"
      - "3001:3001"
      - "1234:1234"
    volumes:
      - lmstudio-config:/config

  debian-qwen25-coder:
    image: ghcr.io/tatanecode/debian-qwen25-coder:latest
    pull_policy: always
    container_name: debian-qwen25-coder
    ports:
      - "11434:11434"

  debian-qwen3-coder:
    image: ghcr.io/tatanecode/debian-qwen3-coder:latest
    pull_policy: always
    container_name: debian-qwen3-coder
    ports:
      - "11435:11434"

  debian-gemma2-abliterated:
    image: ghcr.io/tatanecode/debian-gemma2-abliterated:latest
    pull_policy: always
    container_name: debian-gemma2-abliterated
    ports:
      - "11436:11434"

volumes:
  lmstudio-config:
